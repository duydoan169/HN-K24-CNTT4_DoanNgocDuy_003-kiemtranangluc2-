<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
          integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
</head>
<body>
<form style="display: flex; gap: 10px; align-items: center; margin: 0 10px; flex-wrap: wrap" method="get" th:action="@{/gameItems}">
    <input type="text" th:value="${search}" name="search" placeholder="Tìm theo tên" style="height: 35px; width: 200px">

    <select name="filter" style="height: 35px;">
        <option value="">Tất cả độ hiếm</option>
        <option th:each="r : ${rarities}"
                th:value="${r.id}"
                th:text="${r.name}"
                th:selected="${r.id == filter}">
        </option>
    </select>

    <button type="submit" class="btn btn-primary">Search</button>
</form>
<table class="table table-striped table-inverse">
    <thead class="thead-inverse">
    <tr>
        <th class="text-center">ID</th>
        <th>ITEM NAME</th>
        <th>GAME TITLE</th>
        <th>MARKET PRICE</th>
        <th>DROP DATE</th>
        <th>IMAGE</th>
        <th>IS TRADEABLE</th>
        <th>RARITY</th>
    </tr>
    </thead>
    <tbody>
    <tr th:if="${pageable.totalPages != 0}" th:each="gi : ${pageable.content}">
        <td th:text="${gi.id}"></td>
        <td th:text="${gi.itemName}"></td>
        <td th:text="${gi.gameTitle}"></td>
        <td th:text="${gi.marketPrice}"></td>
        <td th:text="${gi.dropDate}"></td>
        <td th:text="${gi.isTradeable}"></td>
        <td th:text="${gi.rarity != null ? gi.rarity.name : 'Chưa có'}"></td>
    </tr>
    <tr th:if="${pageable.totalPages == 0}">
        <td colspan="7" class="text-center">Không tìm thấy vật phẩm nào</td>
    </tr>
    </tbody>
</table>

<nav style="margin: 10px" aria-label="Page navigation" th:if="${pageable.totalPages != 0}">
    <ul class="pagination">
        <li class="page-item" th:classappend="${pageable.isFirst() ? 'disabled' : ''}">
            <a class="page-link" th:href="@{/gameItems(search=${search}, filter=${filter}, page=${pageable.number - 1}, size=${pageable.size})}" aria-label="Previous">
                <span aria-hidden="true">&laquo;</span>
                <span class="sr-only">Previous</span>
            </a>
        </li>
        <li class="page-item"
            th:each="i : ${#numbers.sequence(0, pageable.totalPages - 1)}"
            th:classappend="${i == pageable.number} ? 'active'">
            <a class="page-link"
               th:text="${i + 1}"
               th:href="@{/gameItems(search=${search}, filter=${filter}, page=${i}, size=${pageable.size})}">
            </a>
        </li>
        <li class="page-item" th:classappend="${pageable.isLast() ? 'disabled' : ''}">
            <a class="page-link" th:href="@{/gameItems(search=${search}, filter=${filter}, page=${pageable.number + 1}, size=${pageable.size})}" aria-label="Next">
                <span aria-hidden="true">&raquo;</span>
                <span class="sr-only">Next</span>
            </a>
        </li>
    </ul>
</nav>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo"
        crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"
        integrity="sha384-UO2eT0CpHqdSJQ6hJty5KVphtPhzWj9WO1clHTMGa3JDZwrnQq4sF86dIHNDz0W1"
        crossorigin="anonymous"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"
        integrity="sha384-JjSmVgyd0p3pXB1rRibZUAYoIIy6OrQ6VrjIEaFf/nJGzIxFDsf4x0xIM+B07jRM"
        crossorigin="anonymous"></script>
</body>
</html>
